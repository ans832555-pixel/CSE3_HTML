<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>

<body>
    <fieldset>
        
        <center>
            <caption>
                <h1>
                    
                    Hotel Room Booking Form
                </h1>
            </caption>
            <form action="#">
                <label for="Name">Full Name:</label>
                <input type="text" name="Name" id="Name">
                <br><br>
                <label for="Email">Email:</label>
                <input type="email" name="Email" id="Email">
                <br><br>
                <label for="Phone">Phone:</label>
                <input type="tel" name="Phone" id="Phone">
                <br><br>
                <label for="Check-in Date">Check-in Date:</label>
                <input type="date" name="Check-in Date" id="Check-in Date">
            <br><br>
            <label for="Check-out Date">Check-out Date:</label>
            <input type="date" name="Check-out Date" id="Check-out Date">
            <br><br>
            <label for="Room Type">Room Type:</label>
            <select name="Room Tyoe" id="Room Type">
                <option value="Single room">Single Room</option>
                <option value="Double Room">Double Room</option>
            </select>
            <br><br>
            <label for="Number of Guests">Number of Guests:</label>
            <input type="number" name="Number of Guests" id="Number of Guests">
            <br><br>
            <label for="Special Requests">Special Requests: </label>
            <br>
            <textarea name="Special Requests" id="Special Requests"></textarea>
            <br><br>
            <input type="submit" value="Book Now">
            <input type="reset">
            
            
            
            
            
            
            
            
        </form>
    </center>
</fieldset>
</body>

</html>
