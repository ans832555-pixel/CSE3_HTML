<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center>
        <h1>Student Registraion Form</h1>
        <hr>
    </center>
    <form action="#">
        <label for="Full Name">Full Name:</label>
        <input type="text" name="Full Name" id="Full Name" placeholder="Enter your Name" required>
        <br><br>
        <label for="Email">Email:</label>
        <input type="email" name="Email" id="Email" placeholder="Enter your Email" required>
        <br><br>
        <label for="Password">Password:</label>
        <input type="password" name="Password" id="Password" placeholder="Enter your Password" required>
        <br><br>
        <label for="gender">Gender:</label>
        <label for="Male">Male:</label>
        <input type="radio" name="gender" id="gender" required>
        <label for="Female">Female:</label>
        <input type="radio" name="gender" id="gender" required>
        <label for="Others">Others:</label>
        <input type="radio" name="gender" id="gender" required>
        <br><br>
        <label for="Course">Course:</label>
        <select name="Course" id="Cousre" required>
            <option value="" disabled selected hidden>-- Select Course--</option>
            <option value="C">C</option>
            <option value="Python">Python</option>
            <option value="C++">C++</option>

        </select>
        <br><br>
        <label for="Contact No:">Contact No:</label>
        <input type="tel" name="Contact No:" id="Contact No:" placeholder="Enter phone number" required>
        <br><br>
        <label for="Address">Address:</label>
        <br>
        <textarea name="Address" id="Address" placeholder="Enter your address"></textarea>
        <br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">


        



    </form>
    <hr>
    <center>&copy; 2025 Student Registration Portal</center>
</body>
</html>
